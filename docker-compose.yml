services:
  document-ai:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_TO_USE=${MODEL_TO_USE:-gpt-4o}
      - TEMPERATURE=${TEMPERATURE:-0.0}
      - MAX_TOKENS=${MAX_TOKENS:-4096}
      - LLM_PROVIDER=${LLM_PROVIDER:-langchain_openai}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RETRY=${RETRY:-3}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - STOCK_SHEET_PDF_MAX_PAGES=${STOCK_SHEET_PDF_MAX_PAGES:-3}
      - STOCK_SHEET_MAX_IMAGE_PIXELS=${STOCK_SHEET_MAX_IMAGE_PIXELS:-25000000}
      - STOCK_SHEET_ENABLE_PREPROCESS=${STOCK_SHEET_ENABLE_PREPROCESS:-true}
      - STOCK_SHEET_LLM_BATCH_SIZE=${STOCK_SHEET_LLM_BATCH_SIZE:-60}
    restart: unless-stopped
