[tool.poetry]
name = "royal-horizon-document-ai"
version = "0.1.0"
description = "Production-ready AI service for document key-value extraction"
authors = ["Royal Horizon"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "0.115.5"
uvicorn = "0.32.1"
python-dotenv = "1.0.1"
pydantic = "2.10.2"
pydantic-settings = "2.11.0"
loguru = "0.7.2"
langchain-openai = "0.3.35"
langchain-core = "0.3.78"
python-multipart = "0.0.20"
pillow = "10.0.0"
pdf2image = "1.17.0"
pymupdf = "1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
start = "src.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
